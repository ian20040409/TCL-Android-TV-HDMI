# ── AndroidX 啟用（修正 "android.useAndroidX property is not enabled" 錯誤）──
android.useAndroidX=true

# ── 建置與 JVM 記憶體優化 ──────────────────────────────────────────────────
# 限制 Gradle Daemon 最大記憶體，避免肥大佔用開發機記憶體，並使用 UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Configuration Cache：跳過重複的配置階段，大幅降低記憶體與加速建置
org.gradle.configuration-cache=true

# 平行處理與建置快取
org.gradle.parallel=true
org.gradle.caching=true

# 增量編譯，降低 Kotlin 編譯時記憶體消耗
kotlin.incremental=true

# ── APK 產出極致瘦身與記憶體佔用優化 ─────────────────────────────────────────
# R8 全模式優化：積極移除未引用的 SDK 與程式碼
android.enableR8.fullMode=true

# 不包含 legacy support libraries，免除額外轉換開銷
android.enableJetifier=false

# 指定本機 JDK 路徑
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
